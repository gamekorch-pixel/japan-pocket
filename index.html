<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🇯🇵 Japan Pocket</title>

  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

  <!-- מצב יום / לילה -->
  <label class="theme-toggle" title="החלף מצב תאורה">
    <input type="checkbox" id="darkCheckbox">
    <div class="track">
      <div class="clouds"></div>
      <div class="stars"></div>

      <div class="thumb">
        <i class="fa-solid fa-sun sun-icon"></i>
        <i class="fa-solid fa-moon moon-icon"></i>
      </div>
    </div>
  </label>

  <header>
    <h1>🇯🇵 Japan Pocket</h1>

    <!-- מחשבון ין -->
    <div class="yen-converter">
      <input type="number" id="yenInput" placeholder="הכנס סכום ¥">
      <div class="divider"></div>
      <div id="yenResult">0.00 ₪</div>
    </div>
  </header>

  <!-- טאבים -->
  <nav class="tabs">
    <button class="tab active" data-tab="phrases">🗣️ משפטים</button>
    <button class="tab" data-tab="food">🍣 אוכל</button>
    <button class="tab" data-tab="transport">🚆 תחבורה</button>
    <button class="tab" data-tab="shopping">🛍️ קניות</button>
    <button class="tab" data-tab="emergency">🚨 חירום</button>
    <button class="tab" data-tab="favorites">❤️ מועדפים</button>
  </nav>

  <!-- תוכן -->
  <main id="content"></main>

  <!-- מודאל -->
  <div id="modal" class="hidden">
    <div class="modal-box">
      <button id="closeModal">✖</button>
      <h1 id="modalJP"></h1>
      <button id="speakModal">🔊 השמע</button>
    </div>
  </div>

  <footer>
    © 2026 נתנאל קורצ׳אגין ·
    <a href="mailto:workforall246@gmail.com">workforall246@gmail.com</a>
  </footer>

  <script src="script.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>

</body>
</html>
